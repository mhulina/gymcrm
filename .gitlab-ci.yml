# Runs on the private runner "fluffy-PC" (tag: gymcrm, Docker executor).
# The docker-build stage builds both prod images (api, webapp) and pushes them to
# DigitalOcean Container Registry (DOCR) - the VPS deploy target only ever pulls
# pre-built images, it never builds anything itself (too little RAM for a fresh
# dotnet+npm build). See VPS_DEPLOY.md.
#
# Both images share ONE DOCR repository ("gymcrm"), distinguished by tag prefix
# (api-... / webapp-...) rather than being two separate repositories - DOCR's free
# Starter tier only includes 1 repository, and this fits both images into it.
# Needs two GitLab CI/CD variables: DO_REGISTRY_NAME (your DOCR registry's name) and
# DO_REGISTRY_EMAIL + DO_REGISTRY_TOKEN (a DigitalOcean account email + API token with
# registry read/write scope, from the DO dashboard's API section).
#
# Each image only ever has ONE tag (api-latest / webapp-latest) - deliberately not also tagging
# with $CI_COMMIT_SHORT_SHA. deploy always pulls :latest anyway, so a per-commit tag was never
# actually used for anything, just dead weight that piled up a new (small but nonzero) image on
# DOCR's free tier on every single deploy. Pushing to the same tag name overwrites what it points
# to instead of adding a new one, so the registry stays at exactly 2 images.
#
# docker-build and deploy only run once code actually lands on master (a merge request being
# merged triggers a normal push pipeline on master, which is what this actually watches for) -
# they don't appear at all on merge request pipelines, not even as a manual option, so there's
# no way to build/deploy unreviewed or unmerged code by clicking the wrong button on an open MR.
# deploy additionally needs
# DEPLOY_SSH_PRIVATE_KEY_B64 (a dedicated deploy keypair's private key, base64-encoded onto
# one line via `base64 -w0`, its public half added to the droplet's ~/.ssh/authorized_keys)
# to SSH in and pull+restart - a regular masked variable, single-line on purpose (a
# multi-line File-type variable kept failing to load with an opaque libcrypto error
# regardless of line-ending fixes, so this sidesteps that entirely).
#
# deploy also generates .env.production on the droplet from PROD_POSTGRES_PASSWORD and
# PROD_JWT_SECRET (both masked+protected) - these MUST match whatever's already running on
# the droplet's Postgres volume/issued JWTs, not freshly-generated values. See VPS_DEPLOY.md.
# It also writes DOCR_REGISTRY_NAME=$DO_REGISTRY_NAME into that file, which
# docker-compose.prod.yml's image: lines interpolate - so the registry name never needs to be
# hardcoded/edited into a tracked file by hand.
#
# workflow: pins pipeline creation to exactly two cases - merge request events and pushes to
# master - instead of relying on GitLab's implicit default. Without this, build/test (which
# have no rules: of their own, since they're meant to always run) weren't reliably included in
# merge request pipelines: GitLab's default only guarantees a plain branch pipeline unless a
# workflow: block says otherwise, so build/test only ran once code hit master post-merge, even
# though docker-build/deploy's own $CI_PIPELINE_SOURCE == "merge_request_event" rule made it
# look like MR pipelines were fully working (they showed up manual-but-skipped, which is correct
# for them, but masked build/test's absence). This also sidesteps GitLab's classic "duplicate
# pipeline" trap (a push to an MR's source branch spawning both a branch pipeline and a merge
# request pipeline for the same commit).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
    - when: never

stages:
  - build
  - test
  - docker
  - deploy

default:
  tags:
    - gymcrm

variables:
  NUGET_PACKAGES: ${CI_PROJECT_DIR}/.nuget/packages

cache:
  key: nuget-packages
  paths:
    - .nuget/packages

# No rules: block on build/test - they're meant to run on every pipeline that gets created at
# all, and the workflow: block above already limits that to MR pipelines and master pushes.
build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - dotnet restore GymCRM.sln
    - dotnet build GymCRM.sln -c Release --no-restore

test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  services:
    - name: postgres:17
      alias: postgres
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: postgres
  script:
    - dotnet restore GymCRM.sln
    - export ConnectionStrings__DefaultConnection="Server=postgres;Port=5432;Database=identity_db;User Id=postgres;Password=postgres;"
    - dotnet test GymCRM.IdentityAPI.Tests -c Release --no-restore --logger "console;verbosity=normal"
    - export ConnectionStrings__DefaultConnection="Server=postgres;Port=5432;Database=scheduling_db;User Id=postgres;Password=postgres;"
    - dotnet test GymCRM.SchedulingAPI.Tests -c Release --no-restore --logger "console;verbosity=normal"

docker-build:
  stage: docker
  image: docker:27
  # No docker:dind service and no DOCKER_TLS_CERTDIR needed here: the runner mounts
  # /var/run/docker.sock straight into the job container (see its config.toml), so
  # this talks directly to the host's Docker daemon instead of a nested one.
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: on_success
    - when: never
  variables:
    DOCR_REPO: registry.digitalocean.com/${DO_REGISTRY_NAME}/gymcrm
  script:
    - docker login -u $DO_REGISTRY_EMAIL -p $DO_REGISTRY_TOKEN registry.digitalocean.com
    - docker build -f GymCRM.Api/Dockerfile
        -t ${DOCR_REPO}:api-latest
        .
    - docker push ${DOCR_REPO}:api-latest
    - docker build -f gymcrm.web/Dockerfile.prod
        --build-arg REACT_APP_API_URL=http://$DEPLOY_IP
        --build-arg REACT_APP_IDENTITY_API_URL=http://$DEPLOY_IP/api/v1/
        --build-arg REACT_APP_SCHEDULING_API_URL=http://$DEPLOY_IP/api/v1/
        --build-arg REACT_APP_ACCOUNTS_ENDPOINT=http://$DEPLOY_IP/api/v1/Authentication/
        --build-arg REACT_APP_MEMBERS_ENDPOINT=http://$DEPLOY_IP/api/v1/Members/
        -t ${DOCR_REPO}:webapp-latest
        gymcrm.web
    - docker push ${DOCR_REPO}:webapp-latest

deploy:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: on_success
    - when: never
  script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    # DEPLOY_SSH_PRIVATE_KEY_B64 is the private key, base64-encoded onto one line
    # (`base64 -w0 gymcrm-deploy-key` locally) before being stored as a regular masked
    # variable - a multi-line File-type variable kept failing to load ("libcrypto:
    # unsupported") regardless of line-ending fixes, so this sidesteps GitLab's multi-line
    # variable handling entirely: a single-line value has no line-wrap/whitespace ambiguity
    # for a web textarea to introduce.
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/deploy_key
    - chmod 600 ~/.ssh/deploy_key
    - ssh-add ~/.ssh/deploy_key
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $DEPLOY_IP >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    # .env.production is gitignored (real secrets, never committed) so git can't sync it -
    # generated here instead, from CI/CD variables, then copied up. PROD_POSTGRES_PASSWORD
    # and PROD_JWT_SECRET must be the exact values already running on the droplet - Postgres
    # only applies POSTGRES_PASSWORD on first init, so a different value here would make the
    # api container authenticate with the wrong password against the already-initialized DB.
    - |
      cat > .env.production.generated << ENVEOF
      DOCR_REGISTRY_NAME=${DO_REGISTRY_NAME}
      POSTGRES_USER=postgres
      POSTGRES_PASSWORD=${PROD_POSTGRES_PASSWORD}
      POSTGRES_PORT=5432
      IDENTITY_DB_NAME=identity_db
      SCHEDULING_DB_NAME=scheduling_db
      JWT_SECRET_KEY=${PROD_JWT_SECRET}
      JWT_ISSUER=GymCRM.IdentityAPI
      JWT_AUDIENCE=GymCRM
      JWT_EXPIRY_MINUTES=60
      Security__MaxFailedLoginAttempts=10
      Security__LockoutDurationMinutes=5
      Security__AuthRateLimitPerMinute=100
      Security__RegisterRateLimitPerMinute=100
      CORS_ALLOWED_ORIGINS=http://${DEPLOY_IP}
      ASPNETCORE_ENVIRONMENT=Production
      ENVEOF
    - scp .env.production.generated root@$DEPLOY_IP:~/gymcrm/.env.production
    # git reset --hard (not just pull) so the droplet always ends up exactly matching
    # master, even if it's drifted via a manual hand-edit in between deploys - only ever
    # touches tracked files, so the .env.production just copied up above is left alone.
    - >-
      ssh root@$DEPLOY_IP
      "cd ~/gymcrm &&
      git fetch origin master &&
      git reset --hard origin/master &&
      docker compose -f docker-compose.prod.yml --env-file .env.production pull &&
      docker compose -f docker-compose.prod.yml --env-file .env.production up -d"
