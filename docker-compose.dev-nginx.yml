
name: gymcrmapp-nginx

services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: GymCRM.Nginx.Dev
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - GymCRMApp
    depends_on:
      api:
        condition: service_started
      webapp:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    container_name: GymCRM.Database
    image: postgres:${POSTGRES_VERSION:-17}
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - LANG=en_US.utf8
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    networks:
      - GymCRMApp
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 3s
      timeout: 2s
      retries: 5

  api:
    container_name: GymCRM.Api
    build:
      context: .
      dockerfile: GymCRM.Api/Dockerfile
    # NO port mapping - only accessible via nginx
    expose:
      - "8080"
      - "8081"
    networks:
      - GymCRMApp
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__Identity=Host=postgres;Port=5432;Database=${IDENTITY_DB_NAME:-identity_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Scheduling=Host=postgres;Port=5432;Database=${SCHEDULING_DB_NAME:-scheduling_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      - Authentication__SecretForKey=${JWT_SECRET_KEY}
      - Authentication__Issuer=${JWT_ISSUER:-GymCRM.IdentityAPI}
      - Authentication__Audience=${JWT_AUDIENCE:-GymCRM}
      - Authentication__ExpiryMinutes=${JWT_EXPIRY_MINUTES:-60}
      - Security__MaxFailedLoginAttempts=${Security__MaxFailedLoginAttempts:-10}
      - Security__LockoutDurationMinutes=${Security__LockoutDurationMinutes:-5}
      - Security__AuthRateLimitPerMinute=${Security__AuthRateLimitPerMinute:-100}
      - Security__RegisterRateLimitPerMinute=${Security__RegisterRateLimitPerMinute:-100}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:8080/health"]
      interval: 5s
      retries: 3
      timeout: 2s

  webapp:
    container_name: GymCRMWebApp
    build:
      context: ./gymcrm.web
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://identity.gymcrm.local}
        - REACT_APP_IDENTITY_API_URL=${REACT_APP_IDENTITY_API_URL:-http://identity.gymcrm.local}
        - REACT_APP_SCHEDULING_API_URL=${REACT_APP_SCHEDULING_API_URL:-http://identity.gymcrm.local}
        - REACT_APP_ACCOUNTS_ENDPOINT=${REACT_APP_ACCOUNTS_ENDPOINT:-http://identity.gymcrm.local/api/v1/Authentication/}
        - REACT_APP_MEMBERS_ENDPOINT=${REACT_APP_MEMBERS_ENDPOINT:-http://identity.gymcrm.local/api/v1/Members/}
    # NO port mapping - only accessible via nginx
    expose:
      - "3000"
    networks:
      - GymCRMApp
    depends_on:
      - api
    restart: unless-stopped

networks:
  GymCRMApp:
    driver: bridge

volumes:
  postgres_data: