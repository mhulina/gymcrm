
name: gymcrm-dev

services:
  postgres:
    container_name: GymCRM.Database.Dev
    image: postgres:${POSTGRES_VERSION:-17}
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - LANG=en_US.utf8
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"  # Exposed so local IDE can connect
    networks:
      - GymCRMApp
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 3s
      timeout: 2s
      retries: 5

  # GymCRM.Api - the consolidated host (Identity + Scheduling + Billing modules in one process).
  # Comment this out when debugging GymCRM.Api locally.
  api:
    container_name: GymCRM.Api.Dev
    build:
      context: .
      dockerfile: GymCRM.Api/Dockerfile
    ports:
      - "55080:8080"  # Exposed for local access
    networks:
      - GymCRMApp
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Identity=Host=postgres;Port=5432;Database=${IDENTITY_DB_NAME:-identity_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Scheduling=Host=postgres;Port=5432;Database=${SCHEDULING_DB_NAME:-scheduling_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Billing=Host=postgres;Port=5432;Database=${BILLING_DB_NAME:-billing_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      - Authentication__SecretForKey=${JWT_SECRET_KEY}
      - Authentication__Issuer=${JWT_ISSUER:-GymCRM.IdentityAPI}
      - Authentication__Audience=${JWT_AUDIENCE:-GymCRM}
      - Authentication__ExpiryMinutes=${JWT_EXPIRY_MINUTES:-60}
      - Security__MaxFailedLoginAttempts=${Security__MaxFailedLoginAttempts:-10}
      - Security__LockoutDurationMinutes=${Security__LockoutDurationMinutes:-5}
      - Security__AuthRateLimitPerMinute=${Security__AuthRateLimitPerMinute:-100}
      - Security__RegisterRateLimitPerMinute=${Security__RegisterRateLimitPerMinute:-100}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Optional: Web App for testing
  webapp:
    container_name: GymCRMWebApp.Dev
    build:
      context: ./gymcrm.web
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:55080
        - REACT_APP_IDENTITY_API_URL=http://localhost:55080/api/v1/
        - REACT_APP_SCHEDULING_API_URL=http://localhost:55080/api/v1/
        - REACT_APP_BILLING_API_URL=http://localhost:55080/api/v1/
        - REACT_APP_ACCOUNTS_ENDPOINT=http://localhost:55080/api/v1/Authentication/
        - REACT_APP_MEMBERS_ENDPOINT=http://localhost:55080/api/v1/Members/
    ports:
      - "3000:3000"
    networks:
      - GymCRMApp
    depends_on:
      - api
    restart: unless-stopped

networks:
  GymCRMApp:
    driver: bridge
    name: gymcrm-dev-network

volumes:
  postgres_dev_data: