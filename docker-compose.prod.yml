name: gymcrm-prod

services:
  postgres:
    container_name: GymCRM.Database.Prod
    image: postgres:${POSTGRES_VERSION:-17}
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - LANG=en_US.utf8
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
      - postgres_prod_data:/var/lib/postgresql/data
    # No host port published - only reachable from the api container, on the shared network.
    expose:
      - "5432"
    networks:
      - GymCRMApp
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 3s
      timeout: 2s
      retries: 5

  api:
    container_name: GymCRM.Api.Prod
    # Pre-built by CI (.gitlab-ci.yml's docker-build job) and pushed to DigitalOcean
    # Container Registry - the deploy target only ever pulls, never builds, since it
    # doesn't have the RAM for a fresh dotnet build. `docker login registry.digitalocean.com`
    # once before the first `docker compose pull` (see VPS_DEPLOY.md). Replace
    # <DOCR_REGISTRY_NAME> with your actual DOCR registry name.
    image: registry.digitalocean.com/<DOCR_REGISTRY_NAME>/gymcrm:api-latest
    # No host port published - only reachable via the nginx reverse proxy.
    expose:
      - "8080"
    networks:
      - GymCRMApp
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__Identity=Host=postgres;Port=5432;Database=${IDENTITY_DB_NAME:-identity_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Scheduling=Host=postgres;Port=5432;Database=${SCHEDULING_DB_NAME:-scheduling_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      - Authentication__SecretForKey=${JWT_SECRET_KEY}
      - Authentication__Issuer=${JWT_ISSUER:-GymCRM.IdentityAPI}
      - Authentication__Audience=${JWT_AUDIENCE:-GymCRM}
      - Authentication__ExpiryMinutes=${JWT_EXPIRY_MINUTES:-60}
      - Security__MaxFailedLoginAttempts=${Security__MaxFailedLoginAttempts:-10}
      - Security__LockoutDurationMinutes=${Security__LockoutDurationMinutes:-5}
      - Security__AuthRateLimitPerMinute=${Security__AuthRateLimitPerMinute:-100}
      - Security__RegisterRateLimitPerMinute=${Security__RegisterRateLimitPerMinute:-100}
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:8080/health"]
      interval: 5s
      retries: 3
      timeout: 2s

  webapp:
    container_name: GymCRM.WebApp.Prod
    # Pre-built by CI, same as api above - the REACT_APP_* values are baked in at CI build
    # time (from the DEPLOY_IP CI/CD variable), not at deploy time, so they don't appear here.
    image: registry.digitalocean.com/<DOCR_REGISTRY_NAME>/gymcrm:webapp-latest
    # No host port published - only reachable via the nginx reverse proxy.
    expose:
      - "80"
    networks:
      - GymCRMApp
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    container_name: GymCRM.Nginx.Prod
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - GymCRMApp
    depends_on:
      api:
        condition: service_started
      webapp:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  GymCRMApp:
    driver: bridge

volumes:
  postgres_prod_data:
