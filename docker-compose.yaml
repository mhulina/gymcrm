version: '3.9'
name: gymcrmapp

services:
  postgres:
    container_name: GymCRM.Database
    image: postgres
    environment:
      - POSTGRES_PASSWORD=admin
      - LANG=en_US.utf8
      - PG_MAJOR=17
      - PG_VERSION=17.2-1.pgdg120+1
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - /var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - GymCRMApp
    restart: no
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 3s
        timeout: 2s
        retries: 5

  membershipapi:
    container_name: GymCRM.MembershipAPI
    build:
      context: .
      dockerfile: GymCRM.MembershipAPI/Dockerfile
    ports:
      - 55080:8080
      - 55081:8081
    networks:
      - GymCRMApp
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "--silent", "--fail", "http://localhost:8080/health" ]
      interval: 5s
      retries: 3
      timeout: 2s
    
  webapp:
    container_name: GymCRMWebApp
    build:
      context: ./gymcrm.web
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    networks:
      - GymCRMApp
    depends_on:
      membershipapi:
        condition: service_healthy
    restart: unless-stopped
      
networks:
  GymCRMApp:
    driver: bridge
