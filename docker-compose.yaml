name: gymcrmapp

services:
  postgres:
    container_name: GymCRM.Database
    image: postgres:${POSTGRES_VERSION:-17}
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - LANG=en_US.utf8
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    networks:
      - GymCRMApp
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 3s
      timeout: 2s
      retries: 5

  identityapi:
    container_name: GymCRM.IdentityAPI
    build:
      context: .
      dockerfile: GymCRM.IdentityAPI/Dockerfile
    ports:
      - ${IDENTITY_API_HTTP_PORT:-55080}:8080
      - ${IDENTITY_API_HTTPS_PORT:-55081}:8081
    networks:
      - GymCRMApp
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${IDENTITY_DB_NAME:-identitydb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      - Authentication__SecretForKey=${JWT_SECRET_KEY}
      - Authentication__Issuer=${JWT_ISSUER:-GymCRM.IdentityAPI}
      - Authentication__Audience=${JWT_AUDIENCE:-GymCRM}
      - Authentication__ExpiryMinutes=${JWT_EXPIRY_MINUTES:-60}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:8080/health"]
      interval: 5s
      retries: 3
      timeout: 2s
  
  schedulingapi:
    container_name: GymCRM.SchedulingAPI
    build:
      context: .
      dockerfile: GymCRM.SchedulingAPI/Dockerfile
    ports:
      - ${SCHEDULING_API_HTTP_PORT:-55085}:8080
      - ${SCHEDULING_API_HTTPS_PORT:-55086}:8081
    networks:
      - GymCRMApp
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${SCHEDULING_DB_NAME:-schedulingdb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      - Authentication__SecretForKey=${JWT_SECRET_KEY}
      - Authentication__Issuer=${JWT_ISSUER:-GymCRM.IdentityAPI}
      - Authentication__Audience=${JWT_AUDIENCE:-GymCRM}
      - IdentityApiUrl=${IDENTITY_API_URL:-http://identityapi:8080}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:8080/health"]
      interval: 5s
      retries: 3
      timeout: 2s
  
  webapp:
    container_name: GymCRMWebApp
    build:
      context: ./gymcrm.web
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:55080}
    ports:
      - ${WEBAPP_PORT:-3000}:3000
    networks:
      - GymCRMApp
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:55080}
      - REACT_APP_IDENTITY_API_URL=${REACT_APP_IDENTITY_API_URL:-http://localhost:55080}
      - REACT_APP_SCHEDULING_API_URL=${REACT_APP_SCHEDULING_API_URL:-http://localhost:55085}
    depends_on:
      identityapi:
        condition: service_healthy
    restart: unless-stopped

networks:
  GymCRMApp:
    driver: bridge

volumes:
  postgres_data: