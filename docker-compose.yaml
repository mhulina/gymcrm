name: gymcrmapp

services:
  postgres:
    container_name: GymCRM.Database
    image: postgres
    environment:
      - POSTGRES_PASSWORD=admin
      - LANG=en_US.utf8
      - PG_MAJOR=17
      - PG_VERSION=17.2-1.pgdg120+1
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - GymCRMApp
    restart: no
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 3s
        timeout: 2s
        retries: 5

  identityapi:
    container_name: GymCRM.IdentityAPI
    build:
      context: .
      dockerfile: GymCRM.IdentityAPI/Dockerfile
    ports:
      - 55080:8080
      - 55081:8081
    networks:
      - GymCRMApp
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "--silent", "--fail", "http://localhost:8080/health" ]
      interval: 5s
      retries: 3
      timeout: 2s
      
  schedulingapi:
    container_name: GymCRM.SchedulingAPI
    build:
      context: .
      dockerfile: GymCRM.SchedulingAPI/Dockerfile
    ports:
      - 55085:8080
      - 55086:8081
    networks:
      - GymCRMApp
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "--silent", "--fail", "http://localhost:8082/health" ]
      interval: 5s
      retries: 3
      timeout: 2s
    
  webapp:
    container_name: GymCRMWebApp
    build:
      context: ./gymcrm.web
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    networks:
      - GymCRMApp
    depends_on:
      identityapi:
        condition: service_healthy
    restart: unless-stopped
      
networks:
  GymCRMApp:
    driver: bridge
    
volumes:
  postgres_data:
