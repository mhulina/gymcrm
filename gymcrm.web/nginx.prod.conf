server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No /api/ proxy here on purpose - see Dockerfile.prod's comment. The outer reverse-proxy
    # nginx (docker-compose.prod.yml) handles that; this container only ever serves static files.

    location / {
        try_files $uri /index.html;
    }
}
