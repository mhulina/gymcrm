events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Service names resolved via Docker Compose's built-in DNS on the shared network - the same
    # mechanism docker-compose.dev-nginx.yml's generated config already uses successfully.
    upstream api {
        server api:8080;
    }

    upstream webapp {
        server webapp:80;
    }

    server {
        listen 80;
        # "_" is nginx's catch-all - matches requests to the droplet's bare IP, no domain needed.
        # If you add a real domain later, change this to that domain and see the HTTPS block below.
        server_name _;

        location /health {
            proxy_pass http://api/health;
            access_log off;
        }

        location /api/ {
            proxy_pass http://api/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://webapp/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
    }

    # HTTPS - not usable without a real domain (Let's Encrypt can't issue a cert for a bare IP), so
    # this block stays commented out for a no-domain, IP-only deployment. If you add a domain
    # later: uncomment this, set server_name to the domain, get certs (e.g. via certbot:
    # `certbot certonly --standalone -d yourdomain.com -d www.yourdomain.com`), copy
    # fullchain.pem/privkey.pem into ./nginx/certs/ next to this file (bind-mounted into the
    # container), and add a `return 301 https://$host$request_uri;` in place of the http server's
    # location blocks above so plain HTTP redirects instead of serving directly.
    #
    # server {
    #     listen 443 ssl;
    #     server_name yourdomain.com www.yourdomain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    #     location /health {
    #         proxy_pass http://api/health;
    #         access_log off;
    #     }
    #
    #     location /api/ {
    #         proxy_pass http://api/api/;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_set_header X-Forwarded-Host $host;
    #         proxy_buffering off;
    #     }
    #
    #     location / {
    #         proxy_pass http://webapp/;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_set_header X-Forwarded-Host $host;
    #     }
    # }
}
