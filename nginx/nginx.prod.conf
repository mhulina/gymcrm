events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Service names resolved via Docker Compose's built-in DNS on the shared network - the same
    # mechanism docker-compose.dev-nginx.yml's generated config already uses successfully.
    upstream api {
        server api:8080;
    }

    upstream webapp {
        server webapp:80;
    }

    server {
        listen 80;
        # TODO: replace with your real domain before deploying.
        server_name yourdomain.com www.yourdomain.com;

        location /health {
            proxy_pass http://api/health;
            access_log off;
        }

        location /api/ {
            proxy_pass http://api/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://webapp/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
    }

    # HTTPS - uncomment once you have real certs (e.g. via certbot: `certbot certonly --standalone
    # -d yourdomain.com -d www.yourdomain.com`, then copy fullchain.pem/privkey.pem into
    # ./nginx/certs/ next to this file, which is bind-mounted into the container). Also add a
    # `return 301 https://$host$request_uri;` in place of the location blocks above once this
    # is live, so plain HTTP redirects instead of serving directly.
    #
    # server {
    #     listen 443 ssl;
    #     server_name yourdomain.com www.yourdomain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    #     location /health {
    #         proxy_pass http://api/health;
    #         access_log off;
    #     }
    #
    #     location /api/ {
    #         proxy_pass http://api/api/;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_set_header X-Forwarded-Host $host;
    #         proxy_buffering off;
    #     }
    #
    #     location / {
    #         proxy_pass http://webapp/;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_set_header X-Forwarded-Host $host;
    #     }
    # }
}
